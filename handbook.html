<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>حكاية سين ون | Scene One</title>
  <!-- Not a destination, so it must not collect search traffic of its own. -->
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="assets/favicon-v2.png">
  <!-- Warm the connection; the booklet is 2MB and the hand-off is immediate. -->
  <link rel="prefetch" href="/assets/scene-one-booklet-ar.pdf">
  <!--
    WHY THIS PAGE EXISTS

    The story used to be linked straight at /assets/scene-one-booklet-ar.pdf.
    A static asset is not a page view, so Vercel's analytics never saw it and
    there was no way to tell how many people opened it.

    This page is the thing that gets counted. It shows nothing of its own: it
    waits only as long as the analytics beacon needs, then hands over to the
    PDF. A reader sees the booklet, the same as before.
  -->
  <script defer src="/_vercel/insights/script.js"></script>
  <style>
    body {
      margin: 0; min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #f9f4ef; color: #7a736a;
      font-family: Tajawal, system-ui, sans-serif; font-size: 16px;
      text-align: center; padding: 24px;
    }
    a { color: #cd2e07; }
  </style>
</head>
<body>
  <!-- Visible only if the hand-off is slow, or if scripting is off — in which
       case this link is the whole page and still works. -->
  <p>جارٍ فتح الكتيّب…<br><a href="/assets/scene-one-booklet-ar.pdf">افتحه يدويًا إن لم يبدأ</a></p>

  <script>
    (function () {
      "use strict";
      var PDF = "/assets/scene-one-booklet-ar.pdf";
      var gone = false;

      // replace(), not assign(): the booklet takes this entry in the history,
      // so Back returns to the page the reader came from rather than bouncing
      // them through here again.
      function open() { if (!gone) { gone = true; location.replace(PDF); } }

      // The beacon is the only reason to pause at all, so wait for the
      // analytics script to load and give it a moment to report — then go.
      var s = document.querySelector('script[src*="insights"]');
      if (s) { s.addEventListener("load", function () { setTimeout(open, 250); }); }

      // And go regardless. Analytics must never be what keeps a reader from
      // the booklet: if the script is blocked, slow or missing, this fires.
      setTimeout(open, 1200);
    })();
  </script>
</body>
</html>
