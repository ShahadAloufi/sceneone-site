<script>
  (function(){try{var l=localStorage.getItem('sceneone-treatment-lang');l=(l==='en'||l==='ar')?l:'ar';
    document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');}
    catch(e){document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl');}})();

<style>
  :root{
    --ink:#15110f; --orange:#CD2E07; --line:#e7e2da; --line2:#efebe3;
    --muted:#8a8178; --label:#6f665e; --soft:#f3efe8;
    --page:#efeae2;
    --font:'Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  /* English: swap to IBM Plex Sans, same split as the marketing pages'
     css/styles.css (this page is self-contained, so it needs its own copy). */
  html[dir="ltr"]{
    /* IBM Plex Sans carries no Arabic, so without a named Arabic face after it
       any Arabic on an English page — a writer's name, a title, a logline —
       fell through to the system UI font and rendered in a different face from
       the rest of the platform. Font fallback is per GLYPH, so Latin still gets
       Plex and Arabic gets Tajawal: one stack, both scripts, no markup needed. */
    --font:'IBM Plex Sans','Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
       padding:12px 20px;background:rgba(14,14,14,.96);border-bottom:2px solid var(--orange)}
  .bar .wm{height:26px;width:auto;display:block}
  .bar .spacer{margin-inline-start:auto}
  .langseg{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:9px}
  .langseg button{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:500;
                  color:#cfcac3;padding:6px 12px;border-radius:7px;cursor:pointer}
  .langseg button.on{background:#fff;color:#15110f}
  .badge{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-family:inherit;
       font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:9px}

  main{padding:28px 16px 60px}
  #reportWrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:800px;margin:0 auto;
              box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .report{padding:46px 54px}
  @media(max-width:620px){.report{padding:30px 22px}}
  .rep-header{background:#0E0E0E;margin:-46px -54px 32px;padding:32px 24px 24px;text-align:center;border-bottom:3px solid var(--orange)}
  @media(max-width:620px){.rep-header{margin:-30px -22px 26px}}
  .rep-logo{height:64px;width:auto;display:inline-block;margin-bottom:12px}
  .rep-cov{color:#9a938b;letter-spacing:.3em;font-size:10px;text-transform:uppercase;margin-top:10px;font-weight:500}
  #reportBody.ar{font-family:'Tajawal',sans-serif}
  #reportBody.ar .rep-sec h2 .no{margin-right:0;margin-left:8px}
  #reportBody.ar table.gl td.cat{text-align:right}
  #reportBody.ar .rep-top{direction:rtl}
  #reportBody.ar .rep-top .k,#reportBody.ar .rep-top .v{text-align:right}
  #reportBody.ar .rep-foot{flex-direction:row-reverse}
  .rep-top{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px;margin-bottom:30px}
  @media(max-width:620px){.rep-top{grid-template-columns:1fr 1fr}}
  .rep-top .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600}
  .rep-top .v{font-size:14px;margin-top:3px}
  .rep-title{font-size:22px;font-weight:600;margin:2px 0 0}
  .rep-title .ar{font-family:'Tajawal',sans-serif;color:var(--ink)}
  .logline{background:var(--soft);border-radius:10px;padding:16px 18px;margin:6px 0 30px}
  .logline .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:5px}
  .logline > div:not(.k){font-size:13.5px;line-height:1.62}
  .glance{margin:0 0 30px}
  .glance h3,.rep-sec h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin:0 0 12px}
  table.gl{width:100%;border-collapse:collapse;font-size:13px}
  table.gl td{padding:7px 6px;border-bottom:1px solid var(--line2)}
  table.gl .cat{color:var(--label);width:34%}
  table.gl .mark{text-align:center}
  table.gl .mark.hit{color:var(--ink);font-weight:600}
  table.gl .mark.dim{color:#d8d2c8}
  .rep-sec{margin:0 0 26px}
  .rep-sec .no{color:var(--orange);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
  .rep-sec h2{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline}
  .rep-item{margin:0 0 16px}
  .rep-item .ih{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
  .rep-item .ih .t{font-weight:600;font-size:13.5px}
  .rep-item .ih .sc{font-size:12px;color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
  .rep-item p{margin:0;color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .rep-sec > p,.verdict > p{color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .verdict{border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--soft);margin-top:8px}
  .verdict .vh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:8px}
  .verdict .vd{font-size:18px;font-weight:600;margin-bottom:8px}
  .verdict .vd .ctx{font-size:13px;font-weight:400;color:var(--label)}
  /* The definition now sits in .ctx beside the grade and can run long, so the
     row wraps. Without a basis the score was pushed onto a line of its own
     and read as orphaned; this keeps it at the end of the grade line and lets
     the definition wrap within its own column instead. */
  .verdict .vd{flex:1 1 60%;min-width:0}
  /* The verdict's fixed definition, between the grade and the reader's own
     words. Lighter and smaller than the prose below it so the two do not read
     as one paragraph, and NOT pre-wrap — it is a fixed string, not typed. */
  .verdict .vdesc{margin:0 0 10px;font-size:12.5px;line-height:1.6;color:var(--label)}
  .score10{font-weight:600;color:var(--orange);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:16px;direction:ltr}
  .score10 .n{font-size:30px}
  .rep-foot{border-top:1px solid var(--line2);margin-top:34px;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .empty{color:#c9c2b6;font-style:italic}
  html[lang="ar"] .rep-cov,html[lang="ar"] .rep-top .k,html[lang="ar"] .logline .k,
  html[lang="ar"] .glance h3,html[lang="ar"] .rep-sec h3,html[lang="ar"] .verdict .vh{letter-spacing:normal}

  .sample-tag{max-width:800px;margin:0 auto 14px;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.02em}

  @media print{
    .bar{display:none!important}
    .sample-tag{display:none!important}
    body{background:#fff}
    main{padding:0}
    #reportWrap{border:0;border-radius:0;box-shadow:none;max-width:none}
  }

  @media(max-width:480px){
    .bar{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .bar .wm{height:22px}
    .bar .spacer{margin-inline-start:auto}
    .langseg button{padding:6px 10px;font-size:13px}
    main{padding:20px 12px 48px}
    #reportWrap{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .report{padding:26px 18px}
    .rep-header{margin:-26px -18px 24px;padding:26px 18px 20px}
    .rep-title{font-size:20px}
    .rep-top{grid-template-columns:1fr 1fr;gap:16px 20px}
    .verdict{padding:18px 18px}
  }
</style>
<style>
  /* A treatment's strengths / to-develop are lists, not paragraphs — the one
     shape js/report-render.js has never had to produce. */
  .rep-list{margin:0;padding-inline-start:18px;color:#3f3a35;font-size:13.5px;line-height:1.62}
  .rep-list li{margin:0 0 5px}
</style>

<div class="bar">
  <img class="wm" src="assets/scene-one-mark-v5.svg" alt="Scene One">
  <div class="spacer"></div>
  <div class="langseg" id="langSeg">
    <button data-l="ar" class="on">العربية</button>
    <button data-l="en">English</button>
  </div>
  <span class="badge" id="sampleBadge">نموذج تقرير معالجة</span>
</div>

<main>
  <p class="sample-tag" id="sampleNote"></p>
  <div id="reportWrap"><div class="report" id="reportBody"></div></div>
</main>

<script src="js/report-render.js"></script>
<script>
(function () {

     path, the same seven points and the same three-part structure a writer gets
     in a real report. The only thing this page still owns is its chrome and its
     content.

     Its own language key, so a visitor reading this sample never flips the
     script sample (or a writer's real report) into the other language. */
  var LANG_KEY = "sceneone-treatment-lang";
  var R = window.SOReport;
  var SCHEMA = R.TREATMENT_SCHEMA;

      note: "هذا نموذج توضيحي لشكل تقرير تغطية المعالجة فقط، ولم يُكتب من قبل قُرّاؤنا المحترفين."
    },

      logline: "تجلب شابة بكرة فيلم لم تُحمَّض ورثتها عن جدتها الراحلة إلى آخر محل تصوير في مدينة ساحلية، ليجد المصوّر المسنّ الذي يدير المحل نفسه وجهاً لوجه أمام فصلٍ مدفون من ماضيه." },
    en: { titleEn: "The Darkroom", titleAr: "الغرفة المظلمة", writer: "–", format: "Treatment · short film",

  var AR = {

    readerLogline: "يجد مصوّر مسنّ في آخر محل تحميض بمدينة ساحلية أن بكرة فيلم جلبتها شابة عن جدتها الراحلة تكشف فصلًا من ماضيه هو، فيُجبر خلال يوم واحد على مواجهة قرار اتخذه قبل أربعين عامًا.",
    assessment: "أقوى ما في المعالجة فكرتها البصرية: الصورة التي تظهر تدريجيًا هي نفسها آلية السرد. أكثر ما يحدّها أن التحول الداخلي لسعيد يأتي من الاكتشاف أكثر مما يأتي من قرار يتخذه. المعالجة جاهزة للانتقال إلى السيناريو بعد دورة تطوير واحدة مركّزة على ذلك التحول.",
    synopsis: "تخسر مدينة ساحلية صغيرة ملامحها تدريجيًا أمام زحف العمران. يدير سعيد، مصوّر مسنّ، آخر محل لتحميض الأفلام. تدخل ريم، شابة في العشرينيات، حاملةً بكرة فيلم قديمة عثرت عليها بين أغراض جدتها الراحلة، وتطلب تحميضها.\n\nعلى مدار يوم واحد، ومع تَكشُّف الصور واحدةً تلو الأخرى في الغرفة المظلمة، تنكشف فصول من حياة الجدة لم تكن ريم تعرفها، وتتشابك على نحو غير متوقّع مع ماضي سعيد. تقوده تلك الصور إلى مواجهة قرار اتخذه قبل أربعين عامًا، وخسارة ظلّ يتجاهلها. في النهاية، تغادر ريم وقد رأت جدتها من زاوية جديدة، بينما يبقى سعيد وحيدًا أمام صورة، ليقرر أخيرًا طيّ صفحة طال انتظارها.",
    glance: {
      "Premise & Theme": "Strong", "Hook & Originality": "Strong", "Stakes, Conflict & Plot": "Promising",
      "Characters & Arcs": "Promising", "Structure & Momentum": "Strong",

    },
    eval: {
      "Premise & Theme": { text: "فكرة تقوم على استخدام «بكرة فيلم» كأداة سردية لكشف الماضي تدريجيًا، ما يمنحها طابعًا بصريًا ورمزيًا قويًا. الموضوع يشتغل على الذاكرة والمصالحة مع الماضي بطريقة بسيطة وعميقة في الوقت نفسه، والثيمة تظهر عبر ما يفعله سعيد لا عبر ما يقوله." },
      "Hook & Originality": { text: "البداية تعتمد على فكرة جذابة بصريًا: عملية تحميض تكشف وجوهًا وذكريات مدفونة. التوتر هنا ليس حدثيًا بل اكتشافي، وهو مناسب جدًا لفيلم يقوم على الانكشاف التدريجي. الأصالة في الآلية نفسها أكثر منها في الحكاية، وهذا كافٍ في هذه المرحلة." },
      "Stakes, Conflict & Plot": { text: "الصراع داخلي في معظمه: سعيد يقاوم ما تكشفه الصور. السلسلة السببية واضحة — كل صورة تدفع التالية — لكن ما هو على المحك يظل ضمنيًا. ما الذي يخسره سعيد إن لم يواجه؟ تحديد ذلك صراحةً هو أهم ما تحتاجه الحبكة قبل السيناريو، وهو أيضًا ما يمنع النهاية من أن تبدو هادئة أكثر مما ينبغي." },
      "Characters & Arcs": { text: "الشخصيتان واضحتان وظيفيًا وعاطفيًا: سعيد يمثل الماضي المكبوت، وريم بوابة الكشف. العلاقة بينهما غير مباشرة وتتشكل عبر الصور، وهو اختيار يخدم الفكرة. التحول موجود واتجاهه واضح، لكنه يصل إلى سعيد بدل أن يصنعه؛ قرار يتخذه في الثلث الأخير سيحوّل الرحلة من اكتشاف إلى فعل. ريم بدورها تحتاج إلى رغبة خاصة بها تتجاوز الفضول." },
      "Structure & Momentum": { text: "البناء بسيط وفعّال: بداية تعريفية ← حدث محفّز (الفيلم) ← كشف تدريجي ← ذروة عاطفية. كل صورة جديدة تغيّر ما نعرفه، وهذا كافٍ لحمل المدة المقصودة في فيلم قصير. الثلث الأوسط هو الموضع الذي قد يترهّل إن تشابهت الكشوف في وزنها." },
      "Genre, Tone & Cinematic Potential": { text: "النبرة متماسكة: دراما هادئة تعتمد على الحرفة البصرية. القصة مروية بالأفعال والصور لا بالشرح، والغرفة المظلمة مكان سينمائي بطبيعته — الضوء الأحمر، الورق الذي تظهر عليه الصورة، الزمن الذي يفرضه التحميض نفسه. هذا من أوضح مواطن قوة المشروع." },
      "Treatment Clarity": { text: "المعالجة مكتوبة بوضوح وبأسلوب سينمائي نظيف، والأحداث والعلاقات والنهاية كلها محددة بما يكفي لتقييم مُطّلع. اللغة سهلة التخيّل بصريًا، مع توازن جيد بين السرد والوصف دون إفراط." }
    },
    market: {
      devPriorities: "أولًا: تحديد ما هو على المحك بالنسبة لسعيد، ونقل القرار الحاسم إلى يده. ثانيًا: منح ريم رغبة خاصة بها تتجاوز الفضول. ثالثًا، وهو تفصيل يمكن تأجيله إلى مرحلة السيناريو: تمييز وزن كل صورة عن الأخرى في الثلث الأوسط.",
      tProduction: "النطاق محدود ومُسيطَر عليه: موقع رئيسي واحد، شخصيتان، زمن حاضر، دون مشاهد حركة أو متطلبات خاصة. العبء الإنتاجي الحقيقي في الغرفة المظلمة نفسها — الإضاءة العملية والصور كعناصر ديكور يجب تصميمها مسبقًا. قابلية الإنتاج عالية ضمن ميزانية فيلم قصير.",
      tMarketPos: "الجمهور المستهدف مهتم بالدراما الإنسانية والقصص العاطفية ذات العمق الرمزي، محليًا وخليجيًا، مع تقدير متوقع في المهرجانات الدولية. الموضع الطبيعي للمشروع هو المنح وبرامج دعم الأفلام القصيرة والمهرجانات، لا التوزيع التجاري؛ قوته في العرض. يُقرأ هذا الموضع مستقلًا عن التقييم الإبداعي: محدودية الأفق التجاري هنا ليست مأخذًا على جودة القصة."
    },
    overall: {

      toDevelop: "تحديد ما هو على المحك، ونقل القرار الحاسم إلى يد سعيد، وتعميق الطبقة العاطفية في الذروة، ومنح ريم رغبة خاصة بها."
    },

      text: "معالجة قوية ومتماسكة، تقوم على فكرة بصرية ذكية وبنية بسيطة وفعّالة، وتملك فرصة عالية في برامج الدعم والمهرجانات. أبرز ما يميّزها قدرتها على تحويل فكرة بسيطة إلى تجربة عاطفية مرئية. ما يمنعها اليوم من التوصية الكاملة سؤال واحد تأسيسي: القرار الحاسم يقع خارج يد البطل. دورة تطوير واحدة مركّزة على ذلك كفيلة بنقلها إلى مرحلة السيناريو." }
  };

  var EN = {
    date: "October 2026",
    readerLogline: "In the last developing shop of a fading coastal town, an elderly photographer finds that a film roll brought in by a young woman — her late grandmother's — exposes a chapter of his own past, forcing him, over a single day, to face a decision he made forty years ago.",
    assessment: "The treatment's greatest strength is that its visual idea IS its narrative mechanism: the image surfacing in the tray is the story surfacing. Its most consequential limitation is that Saeed's turning point arrives through discovery rather than through a choice he makes. The material is ready to move toward screenplay after one focused development pass on that turn.",
