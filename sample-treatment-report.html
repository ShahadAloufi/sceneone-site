<title>Scene One | نموذج تقرير تغطية المعالجة</title>
<link rel="icon" type="image/png" href="assets/favicon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>
  (function(){try{var l=localStorage.getItem('sceneone-treatment-lang');l=(l==='en'||l==='ar')?l:'ar';
    document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');}
    catch(e){document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl');}})();

<style>
  :root{
    --ink:#15110f; --orange:#CD2E07; --line:#e7e2da; --line2:#efebe3;
    --muted:#8a8178; --label:#6f665e; --soft:#f3efe8;
    --page:#efeae2;
    --font:'Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  /* English: swap to IBM Plex Sans, same split as the marketing pages'
     css/styles.css (this page is self-contained, so it needs its own copy). */
  html[dir="ltr"]{
    --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
       padding:12px 20px;background:rgba(14,14,14,.96);border-bottom:2px solid var(--orange)}
  .bar .wm{height:26px;width:auto;display:block}
  .bar .spacer{margin-inline-start:auto}
  .langseg{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:9px}
  .langseg button{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:500;
                  color:#cfcac3;padding:6px 12px;border-radius:7px;cursor:pointer}
  .langseg button.on{background:#fff;color:#15110f}
  .badge{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-family:inherit;
       font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:9px}

  main{padding:28px 16px 60px}
  #reportWrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:800px;margin:0 auto;
              box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .report{padding:46px 54px}
  @media(max-width:620px){.report{padding:30px 22px}}
  .rep-header{background:#0E0E0E;margin:-46px -54px 32px;padding:32px 24px 24px;text-align:center;border-bottom:3px solid var(--orange)}
  @media(max-width:620px){.rep-header{margin:-30px -22px 26px}}
  .rep-logo{height:64px;width:auto;display:inline-block;margin-bottom:12px}
  .rep-cov{color:#9a938b;letter-spacing:.3em;font-size:10px;text-transform:uppercase;margin-top:10px;font-weight:500}
  #reportBody.ar{font-family:'Tajawal',sans-serif}
  #reportBody.ar .rep-sec h2 .no{margin-right:0;margin-left:8px}
  #reportBody.ar table.gl td.cat{text-align:right}
  #reportBody.ar .rep-top{direction:rtl}
  #reportBody.ar .rep-top .k,#reportBody.ar .rep-top .v{text-align:right}
  #reportBody.ar .rep-foot{flex-direction:row-reverse}
  .rep-top{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px;margin-bottom:30px}
  @media(max-width:620px){.rep-top{grid-template-columns:1fr 1fr}}
  .rep-top .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600}
  .rep-top .v{font-size:14px;margin-top:3px}
  .rep-title{font-size:22px;font-weight:600;margin:2px 0 0}
  .rep-title .ar{font-family:'Tajawal',sans-serif;color:var(--ink)}
  .logline{background:var(--soft);border-radius:10px;padding:16px 18px;margin:6px 0 30px}
  .logline .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:5px}
  .logline > div:not(.k){font-size:13.5px;line-height:1.62}
  .glance{margin:0 0 30px}
  .glance h3,.rep-sec h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin:0 0 12px}
  table.gl{width:100%;border-collapse:collapse;font-size:13px}
  table.gl td{padding:7px 6px;border-bottom:1px solid var(--line2)}
  table.gl .cat{color:var(--label);width:34%}
  table.gl .mark{text-align:center}
  table.gl .mark.hit{color:var(--ink);font-weight:600}
  table.gl .mark.dim{color:#d8d2c8}
  .rep-sec{margin:0 0 26px}
  .rep-sec .no{color:var(--orange);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
  .rep-sec h2{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline}
  .rep-item{margin:0 0 16px}
  .rep-item .ih{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
  .rep-item .ih .t{font-weight:600;font-size:13.5px}
  .rep-item .ih .sc{font-size:12px;color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
  .rep-item p{margin:0;color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .rep-sec > p,.verdict > p{color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .verdict{border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--soft);margin-top:8px}
  .verdict .vh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:8px}
  .verdict .vd{font-size:18px;font-weight:600;margin-bottom:8px}
  .verdict .vd .ctx{font-size:13px;font-weight:400;color:var(--label)}
  .score10{font-weight:600;color:var(--orange);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:16px;direction:ltr}
  .score10 .n{font-size:30px}
  .rep-foot{border-top:1px solid var(--line2);margin-top:34px;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .empty{color:#c9c2b6;font-style:italic}
  html[lang="ar"] .rep-cov,html[lang="ar"] .rep-top .k,html[lang="ar"] .logline .k,
  html[lang="ar"] .glance h3,html[lang="ar"] .rep-sec h3,html[lang="ar"] .verdict .vh{letter-spacing:normal}

  .sample-tag{max-width:800px;margin:0 auto 14px;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.02em}

  @media print{
    .bar{display:none!important}
    .sample-tag{display:none!important}
    body{background:#fff}
    main{padding:0}
    #reportWrap{border:0;border-radius:0;box-shadow:none;max-width:none}
  }

  @media(max-width:480px){
    .bar{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .bar .wm{height:22px}
    .bar .spacer{margin-inline-start:auto}
    .langseg button{padding:6px 10px;font-size:13px}
    main{padding:20px 12px 48px}
    #reportWrap{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .report{padding:26px 18px}
    .rep-header{margin:-26px -18px 24px;padding:26px 18px 20px}
    .rep-title{font-size:20px}
    .rep-top{grid-template-columns:1fr 1fr;gap:16px 20px}
    .verdict{padding:18px 18px}
  }
</style>
<style>
  /* A treatment's strengths / to-develop are lists, not paragraphs — the one
     shape js/report-render.js has never had to produce. */
  .rep-list{margin:0;padding-inline-start:18px;color:#3f3a35;font-size:13.5px;line-height:1.62}
  .rep-list li{margin:0 0 5px}
</style>

<div class="bar">
  <img class="wm" src="assets/scene-one-mark-v2.png" alt="Scene One">
  <div class="spacer"></div>

<main>

  <div id="reportWrap"><div class="report" id="reportBody"></div></div>
</main>

    glance: { premise: 0, hook: 0, clarity: 0, character: 0, emotional: 1, structure: 0, potential: 0, market: 1, presentation: 0 },
    summary: "تخسر مدينة ساحلية صغيرة ملامحها تدريجيًا أمام زحف العمران. يدير سعيد، مصوّر مسنّ، آخر محل لتحميض الأفلام. تدخل ريم، شابة في العشرينيات، حاملةً بكرة فيلم قديمة عثرت عليها بين أغراض جدتها الراحلة، وتطلب تحميضها.\n\nعلى مدار يوم واحد، ومع تَكشُّف الصور واحدةً تلو الأخرى في الغرفة المظلمة، تنكشف فصول من حياة الجدة لم تكن ريم تعرفها، وتتشابك على نحو غير متوقّع مع ماضي سعيد. تقوده تلك الصور إلى مواجهة قرار اتخذه قبل أربعين عامًا، وخسارة ظلّ يتجاهلها. في النهاية، تغادر ريم وقد رأت جدتها من زاوية جديدة، بينما يبقى سعيد وحيدًا أمام صورة، ليقرر أخيرًا طيّ صفحة طال انتظارها.",

  };

  var EN = {
    submission: { titleEn: "The Darkroom", titleAr: "الغرفة المظلمة", writer: "—", format: "Treatment — short film",

  function $(id) { return document.getElementById(id); }
  function esc(v) {
    return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function lang() {
    try { var l = localStorage.getItem(LANG_KEY); return (l === "en" || l === "ar") ? l : "ar"; }
    catch (e) { return "ar"; }
  }

  function render(d, l) {
    var t = T[l], lb = L[l], ar = (l === "ar"), s = d.submission;

    var top = [
      [t.title, '<span class="rep-title">' + esc(s.titleEn) + ' <span class="ar">(' + esc(s.titleAr) + ")</span></span>", true],
      [t.writer, esc(s.writer)], [t.format, esc(s.format)], [t.genre, esc(s.genre)],
      [t.length, esc(s.length)], [t.stage, esc(s.stage)],
      [t.reader, esc(t.readerName)], [t.date, esc(s.date)]
    ];
    var topHtml = top.map(function (r) {
      return "<div" + (r[2] ? ' style="grid-column:1/-1"' : "") + '><div class="k">' + r[0] +
        '</div><div class="v" dir="auto">' + r[1] + "</div></div>";
    }).join("");

    var opts = [t.excellent, t.good, t.fair, t.poor];
    var glHead = "<tr><td></td>" + opts.map(function (o) { return '<td class="mark">' + o + "</td>"; }).join("") + "</tr>";
    var glHtml = POINTS.map(function (p) {
      var hit = d.glance[p];
      var cells = "";
      for (var i = 0; i < 4; i++) {
        cells += '<td class="mark ' + (i === hit ? "hit" : "dim") + '">' + (i === hit ? "●" : "·") + "</td>";
      }
      return '<tr><td class="cat">' + lb[p] + "</td>" + cells + "</tr>";
    }).join("");

    var evalHtml = POINTS.map(function (p) {
      var e = d.evals[p];
      return '<div class="rep-item"><div class="ih"><span class="t">' + lb[p] + "</span>" +
        '<span class="sc">' + e.score + ' / 5</span></div><p>' + esc(e.text) + "</p></div>";
    }).join("");

    var marketHtml = MARKET.map(function (k) {
      return '<div class="rep-item"><div class="ih"><span class="t">' + lb[k] + "</span></div><p>" +
        esc(d.market[k]) + "</p></div>";
    }).join("");

    function list(items) {
      return '<ul class="rep-list">' + items.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>";

    return '<div class="rep-header">' +

      '<div class="rep-cov">' + t.cover + "</div></div>" +

  function applyLang(l) {

    var rb = $("reportBody");
    rb.innerHTML = render(l === "ar" ? AR : EN, l);
    rb.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    rb.classList.toggle("ar", l === "ar");
  }
