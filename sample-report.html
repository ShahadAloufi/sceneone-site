<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scene One — نموذج تقرير التغطية</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<script>
  (function(){try{var l=localStorage.getItem('sceneone-report-lang');l=(l==='en'||l==='ar')?l:'ar';
    document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');}
    catch(e){document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl');}})();
</script>
<style>
  :root{
    --ink:#15110f; --orange:#CD2E07; --line:#e7e2da; --line2:#efebe3;
    --muted:#8a8178; --label:#6f665e; --soft:#f3efe8;
    --page:#efeae2;
    --font:'IBM Plex Sans Arabic','IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
       padding:12px 20px;background:rgba(14,14,14,.96);border-bottom:2px solid var(--orange)}
  .bar .wm{color:#fff;letter-spacing:.2em;font-weight:700;font-size:15px}
  .bar .wm span{color:var(--orange)}
  .bar .spacer{margin-inline-start:auto}
  .langseg{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:9px}
  .langseg button{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:500;
                  color:#cfcac3;padding:6px 12px;border-radius:7px;cursor:pointer}
  .langseg button.on{background:#fff;color:#15110f}
  .badge{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-family:inherit;
       font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:9px}

  main{padding:28px 16px 60px}
  #reportWrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:800px;margin:0 auto;
              box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .report{padding:46px 54px}
  @media(max-width:620px){.report{padding:30px 22px}}
  .rep-header{background:#0E0E0E;margin:-46px -54px 32px;padding:32px 24px 24px;text-align:center;border-bottom:3px solid var(--orange)}
  @media(max-width:620px){.rep-header{margin:-30px -22px 26px}}
  .rep-logo{height:48px;width:auto;display:inline-block;margin-bottom:14px}
  .rep-wm{color:#fff;letter-spacing:.18em;font-weight:700;font-size:23px;line-height:1}
  .rep-wm span{color:var(--orange)}
  .rep-cov{color:#9a938b;letter-spacing:.3em;font-size:10px;text-transform:uppercase;margin-top:10px;font-weight:500}
  #reportBody.ar{font-family:'IBM Plex Sans Arabic','IBM Plex Sans',sans-serif}
  #reportBody.ar .rep-sec h2 .no{margin-right:0;margin-left:8px}
  #reportBody.ar table.gl td.cat{text-align:right}
  #reportBody.ar .rep-top{direction:rtl}
  #reportBody.ar .rep-top .k,#reportBody.ar .rep-top .v{text-align:right}
  #reportBody.ar .rep-foot{flex-direction:row-reverse}
  .rep-top{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px;margin-bottom:30px}
  @media(max-width:620px){.rep-top{grid-template-columns:1fr 1fr}}
  .rep-top .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600}
  .rep-top .v{font-size:14px;margin-top:3px}
  .rep-title{font-size:22px;font-weight:600;margin:2px 0 0}
  .rep-title .ar{font-family:'IBM Plex Sans Arabic',sans-serif;color:var(--ink)}
  .logline{background:var(--soft);border-radius:10px;padding:16px 18px;margin:6px 0 30px}
  .logline .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:5px}
  .logline > div:not(.k){font-size:13.5px;line-height:1.62}
  .glance{margin:0 0 30px}
  .glance h3,.rep-sec h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin:0 0 12px}
  table.gl{width:100%;border-collapse:collapse;font-size:13px}
  table.gl td{padding:7px 6px;border-bottom:1px solid var(--line2)}
  table.gl .cat{color:var(--label);width:34%}
  table.gl .mark{text-align:center}
  table.gl .mark.hit{color:var(--ink);font-weight:600}
  table.gl .mark.dim{color:#d8d2c8}
  .rep-sec{margin:0 0 26px}
  .rep-sec .no{color:var(--orange);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
  .rep-sec h2{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline}
  .rep-item{margin:0 0 16px}
  .rep-item .ih{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
  .rep-item .ih .t{font-weight:600;font-size:13.5px}
  .rep-item .ih .sc{font-size:12px;color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
  .rep-item p{margin:0;color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .rep-sec > p,.verdict > p{color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .verdict{border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--soft);margin-top:8px}
  .verdict .vh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:8px}
  .verdict .vd{font-size:18px;font-weight:600;margin-bottom:8px}
  .verdict .vd .ctx{font-size:13px;font-weight:400;color:var(--label)}
  .score10{font-weight:600;color:var(--orange);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:16px;direction:ltr}
  .score10 .n{font-size:30px}
  .rep-foot{border-top:1px solid var(--line2);margin-top:34px;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .empty{color:#c9c2b6;font-style:italic}
  html[lang="ar"] .rep-cov,html[lang="ar"] .rep-top .k,html[lang="ar"] .logline .k,
  html[lang="ar"] .glance h3,html[lang="ar"] .rep-sec h3,html[lang="ar"] .verdict .vh{letter-spacing:normal}

  .sample-tag{max-width:800px;margin:0 auto 14px;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.02em}

  @media print{
    .bar{display:none!important}
    .sample-tag{display:none!important}
    body{background:#fff}
    main{padding:0}
    #reportWrap{border:0;border-radius:0;box-shadow:none;max-width:none}
  }

  @media(max-width:480px){
    .bar{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .bar .wm{font-size:14px;letter-spacing:.14em}
    .bar .spacer{margin-inline-start:auto}
    .langseg button{padding:6px 10px;font-size:13px}
    main{padding:20px 12px 48px}
    #reportWrap{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .report{padding:26px 18px}
    .rep-header{margin:-26px -18px 24px;padding:26px 18px 20px}
    .rep-wm{font-size:20px}
    .rep-title{font-size:20px}
    .rep-top{grid-template-columns:1fr 1fr;gap:16px 20px}
    .verdict{padding:18px 18px}
  }
</style>

<div class="bar">
  <div class="wm">SCENE&nbsp;<span>ONE</span></div>
  <div class="spacer"></div>
  <div class="langseg" id="langSeg">
    <button data-l="ar" class="on">العربية</button>
    <button data-l="en">English</button>
  </div>
  <span class="badge" id="sampleBadge">نموذج تقرير</span>
</div>

<main>
  <p class="sample-tag" id="sampleNote">هذا نموذج توضيحي بمحتوى افتراضي — التقرير الفعلي الذي تستلمه بنفس هذا التصميم عبر البريد الإلكتروني.</p>
  <div id="reportWrap"><div class="report" id="reportBody"></div></div>
</main>

<script src="js/report-render.js"></script>
<script>
(function () {
  "use strict";

  var LANG_KEY = "sceneone-report-lang";
  var NOTE = {
    ar: "هذا نموذج توضيحي لشكل التقرير فقط، ولم يُكتب من قبل قُرّاؤنا المحترفين.",
    en: "This is a sample of the report's format only — it wasn't written by our professional readers."
  };
  var BADGE = { ar: "نموذج تقرير", en: "Sample report" };
  var TITLE = { ar: "Scene One — نموذج تقرير التغطية", en: "Scene One — Sample coverage report" };

  var sampleSubmission = {
    titleEn: "The Darkroom",
    titleAr: "الغرفة المظلمة",
    writer: "",
    format: "Short film",
    genre: "Drama",
    length: "نحو 18 صفحة",
    draft: "Final draft",
    logline: "حين تجلب شابة بكرة فيلم لم تُحمّض تركتها جدتها الراحلة إلى آخر محل تصوير في مدينة ساحلية، يطوّرها المصوّر المسنّ الذي يدير المحل، وجهاً لوجه أمام فصل مدفون من ماضيه."
  };

  var sampleCoverage = {
    reader: "Scene One Reader",
    date: "",
    glance: {
      "Premise & Theme": "Excellent",
      "Hook": "Good",
      "Stakes & Plot": "Good",
      "Character": "Excellent",
      "Structure & Pace": "Good",
      "Producibility": "Excellent",
      "Overall presentation": "Good"
    },
    synopsis: "مدينة ساحلية صغيرة بدأت تخسر ملامحها أمام العمران. يدير سعيد مصوّر مسنّ آخر محل لتحميض الأفلام. تدخل ريم، شابة في العشرينيات، حاملةً بكرة فيلم قديمة عثرت عليها بين أغراض جدتها الراحلة، وتطلب تحميضها.\n\nعلى مدار يوم واحد، ومع ظهور الصور صورةً تلو الأخرى في الغرفة المظلمة، تنكشف فصول من حياة الجدة لم تكن ريم تعرفها، وتتقاطع بشكل غير متوقع مع ماضي سعيد نفسه. تقوده الصور إلى مواجهة قرار اتخذه قبل أربعين عامًا وخسارة لم يكن قد حملها. في النهاية تغادر ريم وقد عرفت جدتها من زاوية جديدة، بينما يبقى سعيد وحيدًا أمام صورة ليقرر أخيرًا أن يطوي صفحة طال انتظارها.",
    eval: {
      "Premise & Theme": { score: 5, text: "الفكرة المركزية ذكية واقتصادية في آن واحد: بكرة فيلم تُحمّض تتحول إلى محرّك درامي يكشف الماضي طبقةً طبقة. الغرفة المظلمة ليست مجرد مكان بل استعارة دقيقة عن الذاكرة وعن التحميض البطيء للحقيقة. الموضوع، أي كيف نتصالح مع ما هو إنساني وعابر، مؤثر." },
      "Hook": { score: 4, text: "يفتح النص على لقطة آسرة: يد مرتجفة تغمر ورقة بيضاء في سائل فتطفو ملامح وجه. هذا الافتتاح يعرّف نبرة الفيلم فورًا: هادئة وبصرية ومشحونة. الملاحظة الوحيدة أن المشهد التمهيدي قبل دخول ريم يطول قليلًا، وتقليمه سيجعل الخطاف يمسك المشاهد أسرع." },
      "Stakes & Plot": { score: 4, text: "الرهان داخلي بطبيعته لكنه واضح ومتصاعد: كل صورة تكشف قطعة وتضيّق الخناق على سعيد. تعتمد الحبكة على التتابع لا على الحدث الكبير، وهو خيار مناسب للفيلم القصير. النهاية مفتوحة، وقد يرغب بعض المشاهدين بإشارة أوضح لما سيحدث داخل سعيد، كما تبدو مقصودة ومستحقة." },
      "Character": { score: 5, text: "سعيد شخصية مرسومة بعناية: صمته أبلغ من كلامه، وماضيه يُكشف عبر أفعاله الصغيرة لا عبر الشرح المباشر. وريم ليست مجرد أداة لتحريك الحكاية، بل لها فضول ووجع خاص يجعلانها حاضرة. التباين بين جيلين، جيل يطوّر الصور بيده وجيل لم يعرف إلا الشاشة، يخدم الموضوع دون أن يُقال صراحة." },
      "Structure & Pace": { score: 4, text: "البناء محكم ضمن يوم واحد ومكان واحد، مع تصعيد منظّم تقوده الصور المتتابعة. الإيقاع متأنٍ ويناسب المادة، غير أن المنتصف يحتمل اختصارًا بسيطًا في مشهد الانتظار بين تحميض صورة وأخرى، حيث يكاد الإيقاع يفتر قبل أن يلتقط أنفاسه." },
      "Producibility": { score: 5, text: "عالي القابلية للإنتاج ومناسب للمهرجانات: مكان واحد محوري هو المحل والغرفة المظلمة، وطاقم تمثيل صغير، ومتطلبات بصرية يمكن تحقيقها بميزانية متواضعة. التحدي الأساسي هو اختيار ممثل قادر على حمل مساحات طويلة من الصمت المقنع، إضافة إلى عناية فنية بإضاءة الغرفة المظلمة التي يقوم عليها جمال الفيلم." },
      "Presentation": { score: 4, text: "النص مكتوب بلغة سينمائية نظيفة وبتنسيق سليم في معظمه. توجد ملاحظتان طفيفتان: بعض الأوصاف المشهدية تطول وتميل إلى الأدبية أكثر من اللازم، وبعض الإرشادات الإخراجية يمكن الاستغناء عنها وترك مساحة للمخرج. لا يؤثر ذلك على القراءة، لكن تشذيبه يرفع الاحترافية أمام الممولين والمهرجانات." }
    },
    market: {
      audience: "يخاطب جمهورًا يميل إلى الدراما الإنسانية، مع صدى خاص للمشاهد الخليجي والعربي الذي يعرف هذه المدن الساحلية المتغيرة. ثيمة الذاكرة والفقد تجعله قابلًا للسفر دوليًا.",
      genreDemand: "دراما قصيرة قائمة على الشخصيات والذاكرة، وهو نوع حاضر بقوة في برامج المهرجانات، خصوصًا تلك التي تحتفي بالسينما المؤلفة.",
      pathBuyers: "بحكم كونه فيلمًا قصيرًا، فإن قيمته في الحضور المهرجاني والمنح والترويج لمسيرة المخرج أكثر من البيع التجاري المباشر. المسار الواقعي: مهرجانات إقليمية ودولية، ومن بينها البحر الأحمر، وجهات تمويل تهتم بالسينما المؤلفة والمواهب المحلية.",
      budgetCeiling: "ميزانية منخفضة، وهي نقطة قوة في هذا السوق. قابل للتمويل بدرجة عالية.",
      regional: "الخصوصية الأقوى تجاريًا. خصوصية المدينة الساحلية وحرفة التحميض المندثرة تمنحه حضورًا أمام المهرجانات والممولين الإقليميين.",
      net: "سوق مهرجاني ومنحي قوي بالنسبة لفئته. الأفلام القصيرة محدودة السوق التجاري بطبيعتها، لكن هذا الفيلم في موقع جيد ضمن اقتصاد المهرجانات والمنح."
    },
    overall: {
      strengths: "صوت واثق ومنضبط؛ وفكرة مركزية اقتصادية وغنية بالدلالة، وشخصيتان مرسومتان بعناية، وخصوصية مكانية وثقافية، وملمح إنتاجي محتوى وقابل للتمويل. عمل تعريفي قوي لمخرج.",
      toDevelop: "تقليم المشهد الافتتاحي ومشهد الانتظار في المنتصف.\nمنح سعيد دافعًا إضافيًا قبل الخاتمة، كي لا تتركّز فاعليته في اللقطة الأخيرة وحدها.\nحسم درجة الوضوح العاطفي المطلوبة في النهاية.\nتشذيب الأوصاف المشهدية والإرشادات الإخراجية."
    },
    score10: 8.9,
    verdict: {
      decision: "Recommend",
      context: "في سياق الأفلام القصيرة والمهرجانات",
      text: "فيلم قصير يمتلك صوتًا واثقًا وهوية ثقافية واضحة، يقوم على فكرة آسرة تمنحه فرصة قوية في المهرجانات وبرامج الدعم. ومع بعض الاختصار وإحكام البناء، سيكون أكثر جاهزية للتقديم والمنافسة. أما أبرز قرار إبداعي فيتعلق بمدى فاعلية الشخصية الرئيسية في توجيه مسار الأحداث، وبالدرجة التي ينبغي أن تظل فيها النهاية مفتوحة."
    }
  };

  function $(id) { return document.getElementById(id); }
  function lang() { try { var l = localStorage.getItem(LANG_KEY); return (l === "en" || l === "ar") ? l : "ar"; } catch (e) { return "ar"; } }

  function applyLang(l) {
    try { localStorage.setItem(LANG_KEY, l); } catch (e) {}
    document.documentElement.setAttribute("lang", l);
    document.documentElement.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    document.title = TITLE[l];
    $("sampleNote").textContent = NOTE[l];
    $("sampleBadge").textContent = BADGE[l];
    $("langSeg").querySelectorAll("button").forEach(function (b) { b.classList.toggle("on", b.dataset.l === l); });
    var rb = $("reportBody");
    rb.innerHTML = window.SOReport.render(sampleSubmission, sampleCoverage, l);
    rb.setAttribute("dir", l === "ar" ? "rtl" : "ltr");
    rb.classList.toggle("ar", l === "ar");
  }

  $("langSeg").querySelectorAll("button").forEach(function (b) {
    b.addEventListener("click", function () { applyLang(b.dataset.l); });
  });

  applyLang(lang());
})();
</script>
