<title>Scene One | نموذج تقرير التغطية</title>
<link rel="icon" type="image/png" href="assets/favicon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  (function(){try{var l=localStorage.getItem('sceneone-report-lang');l=(l==='en'||l==='ar')?l:'ar';
    document.documentElement.setAttribute('lang',l);document.documentElement.setAttribute('dir',l==='ar'?'rtl':'ltr');}
    catch(e){document.documentElement.setAttribute('lang','ar');document.documentElement.setAttribute('dir','rtl');}})();
</script>
<style>
  :root{
    --ink:#15110f; --orange:#CD2E07; --line:#e7e2da; --line2:#efebe3;
    --muted:#8a8178; --label:#6f665e; --soft:#f3efe8;
    --page:#efeae2;
    --font:'Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  /* English: swap to IBM Plex Sans, same split as the marketing pages'
     css/styles.css (this page is self-contained, so it needs its own copy). */
  html[dir="ltr"]{
    /* IBM Plex Sans carries no Arabic, so without a named Arabic face after it
       any Arabic on an English page — a writer's name, a title, a logline —
       fell through to the system UI font and rendered in a different face from
       the rest of the platform. Font fallback is per GLYPH, so Latin still gets
       Plex and Arabic gets Tajawal: one stack, both scripts, no markup needed. */
    --font:'IBM Plex Sans','Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;
       -webkit-print-color-adjust:exact;print-color-adjust:exact}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
       padding:12px 20px;background:rgba(14,14,14,.96);border-bottom:2px solid var(--orange)}
  .bar .wm{height:26px;width:auto;display:block}
  .bar .spacer{margin-inline-start:auto}
  .langseg{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:9px}
  .langseg button{border:0;background:transparent;font-family:inherit;font-size:13.5px;font-weight:500;
                  color:#cfcac3;padding:6px 12px;border-radius:7px;cursor:pointer}
  .langseg button.on{background:#fff;color:#15110f}
  .badge{border:1px solid rgba(255,255,255,.28);background:rgba(255,255,255,.1);color:#fff;font-family:inherit;
       font-size:13.5px;font-weight:600;padding:8px 16px;border-radius:9px}

  main{padding:28px 16px 60px}
  #reportWrap{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;max-width:800px;margin:0 auto;
              box-shadow:0 18px 50px rgba(0,0,0,.12)}
  .report{padding:46px 54px}
  @media(max-width:620px){.report{padding:30px 22px}}
  .rep-header{background:#0E0E0E;margin:-46px -54px 32px;padding:32px 24px 24px;text-align:center;border-bottom:3px solid var(--orange)}
  @media(max-width:620px){.rep-header{margin:-30px -22px 26px}}
  .rep-logo{height:64px;width:auto;display:inline-block;margin-bottom:12px}
  .rep-cov{color:#9a938b;letter-spacing:.3em;font-size:10px;text-transform:uppercase;margin-top:10px;font-weight:500}
  #reportBody.ar{font-family:'Tajawal',sans-serif}
  #reportBody.ar .rep-sec h2 .no{margin-right:0;margin-left:8px}
  #reportBody.ar table.gl td.cat{text-align:right}
  #reportBody.ar .rep-top{direction:rtl}
  #reportBody.ar .rep-top .k,#reportBody.ar .rep-top .v{text-align:right}
  /* The mirror of the rule above, for the English report. Writer-supplied values
     carry dir="auto" so bidi renders them correctly — which also makes an ARABIC
     value align to its own right, and in an LTR report that reads as one field
     shoved out of its column. Alignment follows the REPORT's language; the text
     keeps its own direction. The logline needs it in both directions for the
     same reason: it is the writer's words, in whichever script they wrote. */
  #reportBody:not(.ar) .rep-top .k,#reportBody:not(.ar) .rep-top .v{text-align:left}
  #reportBody:not(.ar) .logline > div:not(.k){text-align:left}
  #reportBody.ar .logline > div:not(.k){text-align:right}
  #reportBody.ar .rep-foot{flex-direction:row-reverse}
  .rep-top{display:grid;grid-template-columns:repeat(3,1fr);gap:18px 26px;margin-bottom:30px}
  @media(max-width:620px){.rep-top{grid-template-columns:1fr 1fr}}
  .rep-top .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600}
  .rep-top .v{font-size:14px;margin-top:3px}
  .rep-title{font-size:22px;font-weight:600;margin:2px 0 0}
  .rep-title .ar{font-family:'Tajawal',sans-serif;color:var(--ink)}
  .logline{background:var(--soft);border-radius:10px;padding:16px 18px;margin:6px 0 30px}
  .logline .k{font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--label);font-weight:600;margin-bottom:5px}
  .logline > div:not(.k){font-size:13.5px;line-height:1.62}
  .glance{margin:0 0 30px}
  .glance h3,.rep-sec h3{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin:0 0 12px}
  table.gl{width:100%;border-collapse:collapse;font-size:13px}
  table.gl td{padding:7px 6px;border-bottom:1px solid var(--line2)}
  table.gl .cat{color:var(--label);width:34%}
  table.gl .mark{text-align:center}
  table.gl .mark.hit{color:var(--ink);font-weight:600}
  table.gl .mark.dim{color:#d8d2c8}
  .rep-sec{margin:0 0 26px}
  .rep-sec .no{color:var(--orange);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
  .rep-sec h2{font-size:16px;font-weight:600;margin:0 0 14px;display:flex;align-items:baseline}
  .rep-item{margin:0 0 16px}
  .rep-item .ih{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:3px}
  .rep-item .ih .t{font-weight:600;font-size:13.5px}
  .rep-item .ih .sc{font-size:12px;color:var(--orange);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
  .rep-item p{margin:0;color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .rep-sec > p,.verdict > p{color:#3f3a35;font-size:13.5px;line-height:1.62;white-space:pre-wrap}
  .verdict{border:1px solid var(--line);border-radius:12px;padding:22px 24px;background:var(--soft);margin-top:8px}
  .verdict .vh{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--orange);font-weight:600;margin-bottom:8px}
  .verdict .vd{font-size:18px;font-weight:600;margin-bottom:8px}
  .verdict .vd .ctx{font-size:13px;font-weight:400;color:var(--label)}
  .score10{font-weight:600;color:var(--orange);white-space:nowrap;font-variant-numeric:tabular-nums;font-size:16px;direction:ltr}
  .score10 .n{font-size:30px}
  .rep-foot{border-top:1px solid var(--line2);margin-top:34px;padding-top:14px;display:flex;justify-content:space-between;font-size:11px;color:var(--muted);letter-spacing:.04em}
  .empty{color:#c9c2b6;font-style:italic}
  html[lang="ar"] .rep-cov,html[lang="ar"] .rep-top .k,html[lang="ar"] .logline .k,
  html[lang="ar"] .glance h3,html[lang="ar"] .rep-sec h3,html[lang="ar"] .verdict .vh{letter-spacing:normal}

  .sample-tag{max-width:800px;margin:0 auto 14px;text-align:center;font-size:12.5px;color:var(--muted);letter-spacing:.02em}

  @media print{
    .bar{display:none!important}
    .sample-tag{display:none!important}
    body{background:#fff}
    main{padding:0}
    #reportWrap{border:0;border-radius:0;box-shadow:none;max-width:none}
  }

  @media(max-width:480px){
    .bar{flex-wrap:wrap;gap:8px 10px;padding:10px 14px}
    .bar .wm{height:22px}
    .bar .spacer{margin-inline-start:auto}
    .langseg button{padding:6px 10px;font-size:13px}
    main{padding:20px 12px 48px}
    #reportWrap{border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
    .report{padding:26px 18px}
    .rep-header{margin:-26px -18px 24px;padding:26px 18px 20px}
    .rep-title{font-size:20px}
    .rep-top{grid-template-columns:1fr 1fr;gap:16px 20px}
    .verdict{padding:18px 18px}
  }
</style>

<div class="bar">
  <img class="wm" src="assets/scene-one-mark-v3.svg" alt="Scene One">
  <div class="spacer"></div>
  <div class="langseg" id="langSeg">
    <button data-l="ar" class="on">العربية</button>
    <button data-l="en">English</button>
  </div>
  <span class="badge" id="sampleBadge">نموذج تقرير</span>
</div>

<main>
  <p class="sample-tag" id="sampleNote">هذا نموذج توضيحي بمحتوى افتراضي — التقرير الفعلي الذي تستلمه بنفس هذا التصميم عبر البريد الإلكتروني.</p>
  <div id="reportWrap"><div class="report" id="reportBody"></div></div>
</main>

<script src="js/report-render.js"></script>
<script>
(function () {
  "use strict";

  var LANG_KEY = "sceneone-report-lang";
  var NOTE = {
    ar: "هذا نموذج توضيحي لشكل التقرير فقط، ولم يُكتب من قبل قُرّاؤنا المحترفين.",
    en: "This is a sample of the report's format only, it wasn't written by our professional readers."
  };
  var BADGE = { ar: "نموذج تقرير", en: "Sample report" };
  var TITLE = { ar: "Scene One | نموذج تقرير التغطية", en: "Scene One | Sample coverage report" };

  /* Sample submission/coverage is bilingual: everything below is real free
     text a reader would write (logline, synopsis, evaluation notes), which
     report-render.js only translates for its own labels/field names, not
     for reader-authored content (a real coverage is written in one language
     by the reader). Since this is a static demo rather than a real
     submission, it carries a full AR and EN version and applyLang() below
     picks between them — keep the two in step if either changes. */
  var sampleSubmission_AR = {
    titleEn: "My Father's Voice",
    titleAr: "صوت أبي",
    writer: "",
    format: "Short film",
    genre: "دراما اجتماعية",
    length: "18 صفحة",
    draft: "First draft",
    logline: "تعود “نورا” إلى منزل طفولتها بعد وفاة والدها لترتيب مقتنياته قبل بيعه، لكنها تعثر على تسجيلات صوتية تركها الأب في أيامه الأخيرة. ومع وصول شقيقها “سالم”، تتحول مهمة إخلاء المنزل إلى مواجهة مع قرار قديم تسبب في ابتعادهما، ومع أسئلة مؤجلة حول الفقد والمسؤولية والغفران."
  };
  var sampleSubmission_EN = {
    titleEn: "My Father's Voice",
    titleAr: "صوت أبي",
    writer: "",
    format: "Short film",
    genre: "Social drama",
    length: "18 pages",
    draft: "First draft",
    logline: "Nora returns to her childhood home after her father's death to sort through his belongings before it is sold, only to find a set of voice recordings he left behind in his final days. When her brother Salem arrives, clearing out the house turns into a reckoning with an old decision that drove them apart, and with deferred questions about loss, responsibility and forgiveness."
  };

  var sampleCoverage_AR = {
    reader: "Scene One Reader",
    date: "سبتمبر 2026",
    glance: {
      "Premise & Theme": "Good",
      "Hook": "Good",
      "Stakes & Plot": "Good",
      "Character": "Good",
      "Dialogue": "Fair",
      "Structure & Pace": "Good",
      "Producibility": "Excellent",
      "Overall presentation": "Good"
    },
    synopsis: "تدور أحداث الفيلم خلال يوم واحد تعود فيه “نورا” إلى منزل العائلة بعد وفاة والدها، حاملة قرارًا عمليًا يبدو محسومًا: ترتيب الأغراض وإنهاء إجراءات البيع قبل أن يتحول المنزل إلى عبء إضافي عليها. إلا أن وصول شقيقها “سالم” يكشف بسرعة أن الأمر لا يتعلق بالمكان أو بالمقتنيات وحدها، بل بتاريخ طويل من الصمت بينهما. تختلف نورا وسالم في نظرتهما إلى البيت؛ فهي تراه مكانًا يجب تجاوزه كي تتمكن من المضي في حياتها، بينما يراه هو آخر ما تبقى من شكل العائلة الذي عرفه. وبين محاولات الفرز، وفتح الصناديق، وتحديد ما يستحق الاحتفاظ به أو التخلص منه، تبدأ الخلافات القديمة في الظهور من دون أن تُقال مباشرة.\n\nيتغير مسار اليوم حين تعثر نورا على جهاز تسجيل قديم يضم رسائل صوتية سجلها الأب قبل وفاته. لا تبدو الرسائل في البداية أكثر من اعترافات متأخرة أو محاولات مرتبكة للحديث مع أبنائه، لكن محتواها يكشف بالتدريج أن الأب كان يعرف أكثر مما ظنت نورا وسالم عن القطيعة التي نشأت بينهما. ومع كل تسجيل جديد، تتبدل صورة الأب في عينيهما: فهو ليس مجرد والد غائب أو مسؤول عن خطأ سابق، بل رجل أدرك متأخرًا أثر قراراته ولم يعرف كيف يصلح ما أفسده. وفي المقابل، تبدأ الشخصيتان في إدراك أن كل واحدة منهما حملت القصة من زاوية مختلفة، وأن غضبهما لم يكن موجهًا إلى الشخص نفسه بالقدر ذاته.\n\nيصل الفيلم إلى مواجهة بين نورا وسالم حول بيع المنزل وحول ما إذا كان الاحتفاظ بالذكريات شكلًا من أشكال الوفاء أو عائقًا يمنع الإنسان من الاستمرار. لا تنتهي القصة بمصالحة سهلة أو كشف يزيل كل الألم، بل بلحظة أكثر هدوءًا وصدقًا: اعتراف ضمني بأن الفقد لا يمنح إجابات كاملة، وأن بعض العلاقات لا تُصلحها كلمة واحدة. يترك الفيلم شخصياته أمام احتمال بداية جديدة، من دون أن يدّعي أن ما حدث بينهما قد انتهى أو يمكن تجاوزه ببساطة.",
    eval: {
      "Premise & Theme": { score: 4, text: "تقدم الفكرة معالجة إنسانية ناضجة لموضوع الفقد داخل العائلة، وتختار أن تنطلق من موقف بسيط وقابل للتصديق: العودة إلى منزل الوالد المتوفى وترتيب ما تركه خلفه. إلا أن السيناريو لا يتعامل مع هذه اللحظة بوصفها مناسبة للحزن والحنين فقط، بل يستخدمها بوصفها بابًا لمواجهة تاريخ عائلي لم يُغلق فعليًا. تكمن قوة الموضوع في أن الفيلم لا يسأل فقط كيف يتعامل الأبناء مع وفاة الأب، بل كيف يتعاملون مع وجوده المستمر داخل ذاكرتهم، وداخل القرارات التي اتخذها في حياتهم، وداخل الفراغ الذي تركه بعد رحيله. هذا يضيف إلى القصة طبقة أعمق من مجرد الحزن، ويجعلها تتناول أسئلة عن اللوم والندم والمسؤولية والحاجة إلى فهم ما حدث حتى بعد فوات الأوان.\n\nكما ينجح العمل في تقديم المنزل بوصفه جزءًا من الموضوع نفسه. فالمكان ليس موقعًا محايدًا تقع فيه الأحداث، بل يحمل ذاكرة العائلة بكل ما فيها من لحظات حميمة ومؤلمة. كل غرض يعثر عليه الشقيقان، وكل غرفة يدخلانها، وكل شيء يقرران الاحتفاظ به أو التخلص منه، يمكن أن يعكس موقفهما من الماضي. هذا الاختيار يمنح الفيلم طابعًا بصريًا وعاطفيًا غنيًا، خصوصًا لأن القصة لا تحتاج إلى مغادرة المنزل كي توسع عالمها؛ فالعالم الحقيقي للشخصيتين موجود في التفاصيل التي يحاولان تجاهلها أو إخفاء أثرها.\n\nمع ذلك، يمكن أن تصبح الفكرة أكثر خصوصية إذا حُدد الحدث القديم الذي أدى إلى القطيعة بين نورا وسالم بطريقة تترك أثرًا أوضح في حاضرهما. لا يشترط أن يكون الحدث كبيرًا أو مأساويًا، لكن من المهم أن نفهم لماذا بقي حيًا إلى هذه الدرجة، وكيف غيّر مسار كل شخصية. كلما بدا هذا الجرح أكثر ارتباطًا بحياة نورا وسالم الحالية، ازدادت قوة الفيلم وابتعد عن المعالجة العامة للفقد العائلي. ومع ذلك، تظل الفكرة في أساسها قوية، ومناسبة لفيلم قصير يعتمد على المشاعر الدقيقة أكثر من الحبكات الكبيرة." },
      "Hook": { score: 4, text: "يبدأ الفيلم في نقطة مناسبة، إذ يدخل مباشرة إلى يوم إخلاء المنزل من دون أن يستهلك وقتًا طويلًا في التعريف بالشخصيات أو شرح الخلفية. وجود نورا وحدها في البداية، وطريقة تعاملها العملية مع الأغراض، يخلقان سؤالًا مبكرًا حول ما الذي تحاول تجنبه أو الانتهاء منه بسرعة. ثم يأتي حضور سالم بوصفه عنصرًا يغير مزاج المشهد، لأن التوتر بينه وبين نورا لا يحتاج إلى شرح مباشر كي يكون محسوسًا. طريقة الحديث، والاختلاف في المواقف الصغيرة، وغياب الترحيب الواضح بينهما، كلها تفاصيل تخلق فضولًا طبيعيًا حول طبيعة علاقتهما وما الذي تسبب في هذه المسافة.\n\nيشكل العثور على جهاز التسجيل نقطة جذب فعالة، لأنه يقدم عنصرًا ملموسًا يدفع القصة إلى الأمام. لا يعتمد التشويق هنا على سر خارجي أو حدث مفاجئ، بل على رغبة المشاهد في معرفة ما قاله الأب، وما إذا كانت هذه الكلمات ستغير شيئًا في العلاقة بين الشقيقين. وتساعد فكرة توزيع الرسائل على امتداد الفيلم في الحفاظ على الاهتمام، لأن كل تسجيل يمكن أن يكشف معلومة جديدة أو يضيف معنى مختلفًا لما رأيناه سابقًا. كما أن التناقض بين صوت الأب الهادئ وردود فعل الأبناء يخلق توترًا جيدًا؛ فالأب يبدو قريبًا من المشاهد عبر صوته، بينما يشعر أبناؤه بأنه ما زال بعيدًا عنهم حتى بعد وفاته.\n\nقد يستفيد الفيلم من أن تكون الرسالة الأولى أكثر حدة أو تحديدًا، بحيث تمنح المشاهد وعدًا أوضح بأن ما سيكشفه الفيلم ليس مجرد وداع عاطفي. لا يعني ذلك تحويل القصة إلى لغز أو رفع مستوى التشويق بصورة لا تناسب نبرتها، بل جعل البداية تحمل سؤالًا دراميًا أكثر إلحاحًا. كذلك، يمكن زراعة الخلاف حول مصير المنزل في وقت مبكر، حتى يشعر المشاهد بأن اليوم لا يحمل فقط مواجهة مع الماضي، بل قرارًا حاضرًا ستخرج منه الشخصيات بخسارة أو تغيير واضح. عنصر الجذب جيد ومناسب لطبيعة العمل، لكنه سيصبح أكثر قوة إذا بدأت القصة بتوتر أعلى قليلًا." },
      "Stakes & Plot": { score: 4, text: "تعتمد الحبكة على هدف خارجي بسيط ومفهوم: إخلاء منزل الأب قبل بيعه. وهذه البساطة من نقاط قوة العمل، لأن السيناريو لا يحمّل القصة أحداثًا كثيرة أو خطوطًا جانبية لا تحتاج إليها. بدلًا من ذلك، يجعل من عملية الفرز والتنظيف واتخاذ القرارات اليومية الصغيرة محركًا للصراع. فاختيار ما يُرمى وما يُحفظ، ومن يملك الحق في تقرير ذلك، يصبح امتدادًا طبيعيًا للخلاف بين نورا وسالم. ويحسب للنص أن هذا الصراع لا يظهر فجأة، بل يتطور مع كل تفصيل جديد يكشفه المكان أو التسجيلات.\n\nتتصاعد الرهانات بطريقة جيدة حين يتضح أن بيع المنزل لا يمثل الشيء نفسه لكل شخصية. بالنسبة إلى نورا، يبدو البيع محاولة للتحرر من مكان يذكرها بوعود لم تتحقق وبعلاقة تركت فيها شعورًا بالخذلان. أما سالم، فيرى في المنزل آخر علاقة ملموسة تربطه بالأب وبحياة العائلة قبل أن تتغير. هذا الاختلاف يمنح الخلاف بعدًا نفسيًا لا يختزل في المال أو في قرار عقاري، ويجعل المشاهد قادرًا على فهم الطرفين حتى لو اختلف مع أحدهما. كما أن التسجيلات لا تعمل كحل جاهز للمشكلة، بل تزيد من تعقيدها لأنها تعيد فتح ما كان كل منهما يظن أنه تجاوزه.\n\nما قد يحتاج إلى تطوير هو لحظة الذروة. تصل الشخصيتان إلى مواجهة عاطفية مؤثرة، لكن أثرها الدرامي سيكون أقوى إذا اقترنت بقرار واضح يغير شيئًا في وضعهما أو في مصير المنزل. يمكن أن يكون هذا القرار متعلقًا بالبيع، أو بالاحتفاظ بغرض محدد، أو بالاعتراف بحقيقة أخفاها أحدهما، أو حتى بالاختيار بين الاستماع إلى الرسالة الأخيرة أو تركها دون تشغيل. المهم أن يشعر المشاهد بأن المواجهة لم تكن مجرد تفريغ للمشاعر، بل لحظة أعادت ترتيب العلاقة أو دفعت الشخصيات إلى مكان جديد. الحبكة متماسكة في شكلها الحالي، لكنها تحتاج إلى قرار نهائي أكثر حسماً كي يبقى أثرها حاضرًا بعد النهاية." },
      "Character": { score: 4, text: "تتمتع نورا بحضور واضح بوصفها الشخصية التي تقود الفيلم، وتنجح في أن تكون محبوبة ومربكة في الوقت نفسه. فهي ليست شخصية قاسية أو باردة بطبيعتها، لكن طريقتها العملية في التعامل مع وفاة الأب ومع المنزل توحي بأنها اختارت التنظيم والسيطرة كوسيلة لحماية نفسها من مشاعر لا تعرف كيف تواجهها. ينجح السيناريو في عدم شرح هذه الفكرة بصورة مباشرة، بل يتركها تظهر من خلال تصرفاتها: استعجالها في إنهاء المهمة، اعتراضها على الاحتفاظ بأشياء تبدو غير مهمة، ورغبتها في تجنب الحديث كلما اقترب سالم من الماضي. هذه التفاصيل تجعلها شخصية قابلة للفهم والتعاطف، حتى حين تبدو قاسية في بعض لحظاتها.\n\nيمثل سالم توازنًا جيدًا أمام نورا، لأنه لا يقدم بوصفه الطرف الأكثر حساسية أو الأكثر صوابًا، بل كشخص اختار طريقة أخرى للتعامل مع الخسارة. يبدو أكثر تعلقًا بالمكان وبالمقتنيات، لكنه لا يملك بالضرورة اللغة التي تمكنه من شرح هذا التعلق. كما أن هدوءه لا يعني غياب الغضب، بل قد يكون طريقة مختلفة لإخفائه. ويستفيد الفيلم من هذا التباين بين الشخصيتين في بناء توتر طبيعي؛ فكل واحدة منهما ترى الأخرى وكأنها تتصرف بطريقة خاطئة، بينما يكتشف المشاهد تدريجيًا أن كليهما يحمل شكلًا مختلفًا من الألم.\n\nيحضر الأب كشخصية ثالثة مؤثرة رغم غيابه الجسدي، وهي نقطة جيدة في البناء. التسجيلات تمنحه فرصة للظهور كشخص غير مكتمل، حاول الفهم والاعتذار متأخرًا، بدل أن يظهر بصفته رمزًا مثاليًا أو شخصًا مسؤولًا عن كل ما حدث. إلا أن شخصية سالم تحتاج إلى مساحة أكثر استقلالية؛ إذ تظهر بعض دوافعه غالبًا كرد فعل على نورا أو على كلام الأب. من المفيد منحه لحظة أو تفصيلة تكشف ما الذي خسره هو شخصيًا، وما الذي يخاف من فقدانه بعد بيع المنزل. عندها سيصبح الصراع بينهما أكثر توازنًا، وستبدو قراراتهما متساوية في القوة والتأثير." },
      "Dialogue": { score: 3, text: "يحتوي الحوار على لحظات طبيعية ومؤثرة، خصوصًا حين تعتمد الشخصيات على الجمل القصيرة والردود غير المكتملة. هناك إحساس جيد بأن نورا وسالم يعرفان بعضهما جيدًا، وأنهما لا يحتاجان إلى إعادة شرح تاريخ العائلة في كل مرة يتحدثان فيها. وتظهر هذه القوة في المقاطعات، وفي تبدل نبرة الصوت، وفي الجمل التي تبدأ بمعنى وتنتهي بمعنى آخر. كما أن وجود التسجيلات الصوتية يمنح الفيلم فرصة لتقديم لغة مختلفة للأب؛ فهو يتحدث من موقع التأمل والندم، بينما يتحدث الأبناء من داخل لحظة الغضب والتردد.\n\nلكن بعض الحوارات تميل إلى الإفصاح أكثر من اللازم، خصوصًا عندما تبدأ الشخصيات في شرح ما حدث في الماضي أو في وصف مشاعرها بوضوح مباشر. في هذه المواضع، يشعر القارئ أحيانًا أن الحوار يشرح الفكرة للمشاهد بدل أن يكشفها من خلال الصراع. من الأفضل أن تثق الشخصيات بأن ما تعرفه مشترك بينهما، فلا تحتاج إلى ذكر كل تفاصيله بصوت عالٍ. يمكن استبدال بعض الجمل الطويلة بنظرة، أو تردد، أو تغيير في موضوع الحديث، أو تصرف يعكس ما لا تستطيع الشخصية قوله.\n\nيحتاج الحوار أيضًا إلى مزيد من الخصوصية في صوت كل شخصية. من المفيد أن تحمل نورا طريقة أكثر اختصارًا وحسمًا في الكلام، وأن يظهر في حديث سالم تردده ورغبته في تجنب المواجهة، بينما تكون التسجيلات أكثر ترتيبًا وتأملًا بسبب طبيعة الأب وشعوره بالذنب. لا يحتاج الفيلم إلى حوار كثير كي يكون مؤثرًا؛ بل إن قوة الفكرة تكمن في أن الشخصيات تقول أقل مما تشعر به. ومع مراجعة بعض المشاهد التفسيرية واختزالها، سيصبح الحوار أكثر سينمائية وأقرب إلى النبرة الهادئة التي يسعى إليها العمل." },
      "Structure & Pace": { score: 4, text: "يبدأ الفيلم في لحظة مناسبة، لأنه يدخل إلى عالمه مباشرة ويمنح المشاهد هدفًا واضحًا منذ البداية. لا يحتاج النص إلى فصل تمهيدي طويل، إذ إن وجود نورا داخل البيت، ثم وصول سالم، يكفيان لتحديد الحالة العاطفية العامة. كما أن الموقع الواحد يعمل لصالح الإيقاع، لأنه يجعل الشخصيات محاصرة بالمكان وبالذكريات، ويمنح المشاهد إحساسًا بأن كل غرفة يمكن أن تفتح بابًا جديدًا في القصة. ويبدو اختيار يوم واحد للأحداث مناسبًا لفيلم قصير، لأن ضغط الوقت يساعد في منع القصة من التشتت.\n\nيتطور الإيقاع بشكل جيد في النصف الأول من خلال اكتشاف التسجيلات وتبدل العلاقة بين الشخصيتين. وتساعد حركة الفرز والتنقل بين أغراض المنزل في إعطاء المشاهد تنوعًا بصريًا رغم محدودية الموقع. إلا أن النصف الأوسط قد يستفيد من تمييز أكبر بين المشاهد، بحيث لا تؤدي عدة لحظات الوظيفة الشعورية نفسها. إذا كان كل تسجيل جديد يكشف معلومة مختلفة أو يدفع نورا وسالم إلى مستوى جديد من المواجهة، فسيشعر المشاهد بتصاعد أوضح. أما إذا تكررت المشاهد في تأكيد أن بينهما خلافًا قديمًا، فقد يتباطأ الإيقاع دون حاجة.\n\nتصل النهاية إلى نبرة مناسبة للفيلم، لأنها لا تسعى إلى حل كل شيء ولا تحول الخلاف العائلي إلى مصالحة مثالية. هذا اختيار جيد، خصوصًا أن موضوع الفقد لا يقدم إجابات نهائية في الحياة الواقعية. ومع ذلك، تحتاج اللحظة الأخيرة إلى صورة أو فعل يحمل معنى التغيير الذي حدث. يمكن أن يكون شيئًا صغيرًا جدًا، مثل قرار مشاركة غرض معين، أو ترك رسالة أخيرة دون سماعها، أو اختيار البقاء في المنزل لدقائق إضافية بدل المغادرة. وجود هذه اللمسة النهائية سيمنح الإيقاع خاتمة أكثر رسوخًا، ويجعل التحول العاطفي للشخصيات محسوسًا بصريًا لا لفظيًا فقط." },
      "Producibility": { score: 5, text: "يتمتع السيناريو بقابلية إنتاج عالية، لأنه يعتمد على موقع رئيسي واحد وعدد محدود من الشخصيات، من دون الحاجة إلى مشاهد خارجية معقدة أو عناصر إنتاجية كبيرة. يمثل منزل العائلة قلب العمل البصري والدرامي، ويمكن اختيار موقع مناسب أو بناء جزء منه بطريقة اقتصادية تخدم القصة. كما أن معظم الأحداث تدور بين نورا وسالم، بينما يحضر الأب من خلال الصوت، ما يقلل من احتياجات الكاست ومن أيام التصوير من دون أن يضعف العالم العاطفي للفيلم.\n\nتعد التسجيلات الصوتية حلًا إنتاجيًا ذكيًا، لأنها تسمح بإدخال الماضي في الحاضر من دون اللجوء إلى مشاهد فلاش باك تحتاج إلى مواقع إضافية وممثلين وملابس وتصميم زمني مختلف. كذلك، لا يعتمد الفيلم على مؤثرات خاصة أو مشاهد حركة أو عدد كبير من الكومبارس، ولذلك يمكن توجيه جزء أكبر من الميزانية إلى العناصر التي ستصنع الفرق فعلًا: اختيار الممثلين، وجودة تسجيل الصوت، وتصميم الديكور، والإضاءة، والمونتاج.\n\nالتحدي الرئيسي في الإنتاج سيكون جعل المنزل يبدو حيًا ويحمل تاريخ العائلة من دون أن يتحول إلى ديكور مزدحم بلا وظيفة. تحتاج المقتنيات إلى اختيار دقيق، لأن بعضها يجب أن يكشف معلومات أو يثير ردود فعل أو يضيف طبقة إلى شخصية الأب. كما أن تصميم الصوت مهم جدًا، ليس فقط في التسجيلات، بل في صمت المنزل والأصوات الصغيرة داخله، لأن هذه العناصر يمكن أن تمنح الفيلم إحساسه بالوحدة والذاكرة. بصورة عامة، المشروع اقتصادي وقابل للتنفيذ بميزانية منخفضة إلى متوسطة، مع فرصة واضحة لرفع قيمته الفنية عبر التنفيذ الدقيق." },

    synopsis: "The film unfolds over a single day. Nora returns to the family house after her father's death with a decision that looks settled: sort the belongings and finish the sale before the house becomes another weight on her. Her brother Salem's arrival quickly makes clear that this is not about the place or the possessions at all, but about a long history of silence between them. They see the house differently. To her it is somewhere to get past so she can move on with her life; to him it is the last remaining shape of the family he knew. Between the sorting, the opening of boxes, and the deciding of what is worth keeping, the old disagreements begin to surface without ever being spoken outright.\n\nThe day turns when Nora finds an old recorder holding voice messages her father made before he died. At first they seem no more than late confessions, or fumbling attempts to talk to his children. But their content gradually reveals that he knew far more than either of them realised about the rift that grew between them. With each new recording the picture of him shifts: not simply an absent father, or the man to blame for an old mistake, but someone who understood the weight of his decisions too late and never knew how to repair what he had broken. In turn, brother and sister begin to see that each has carried the story from a different angle, and that their anger was never aimed at quite the same person.\n\nThe film builds to a confrontation between Nora and Salem over selling the house, and over whether holding on to memory is a form of loyalty or an obstacle that keeps a person from continuing. It does not end in easy reconciliation, or in a revelation that dissolves the pain. It ends somewhere quieter and more honest: an unspoken admission that loss does not hand out complete answers, and that some relationships are not repaired by a single word. The film leaves its characters facing the possibility of a beginning, without pretending what happened between them is over or easily crossed.",
    eval: {
      "Premise & Theme": { score: 4, text: "The premise offers a mature, humane treatment of loss inside a family, and it starts from a simple, believable situation: returning to a dead father's house and sorting what he left behind. The script does not treat that moment as an occasion for grief and nostalgia alone; it uses it as a door onto a family history that was never actually closed. The strength of the theme is that the film asks not only how children deal with a father's death, but how they deal with his continuing presence inside their memory, inside the decisions he made about their lives, and inside the space he left behind. That gives the story a layer beneath sorrow, and lets it take up questions of blame, regret, responsibility, and the need to understand what happened even after it is too late.\n\nThe work also succeeds in making the house part of the theme itself. The location is not a neutral container for the action; it holds the family's memory with everything intimate and painful in it. Every object the siblings find, every room they enter, everything they decide to keep or discard, can reflect their stance toward the past. That choice gives the film a visually and emotionally rich character, particularly because the story never needs to leave the house to widen its world: the real world of these two characters lives in the details they are trying to ignore.\n\nEven so, the premise could become more specific if the old event that caused the rift between Nora and Salem were defined in a way that leaves a clearer mark on their present. It need not be large or tragic, but we need to understand why it has stayed alive to this degree, and how it altered the course of each of them. The more that wound feels tied to the lives Nora and Salem are living now, the stronger the film becomes and the further it moves from a general treatment of family loss. The premise remains fundamentally strong, and well suited to a short film that works through fine emotion rather than large plotting." },
      "Hook": { score: 4, text: "The film starts at the right point, entering the day of the clear-out directly without spending long on introductions or backstory. Nora alone at the outset, and the practical way she handles the belongings, raise an early question about what she is trying to avoid or finish quickly. Salem's arrival then changes the temperature of the scene, because the tension between them needs no explanation to be felt. The way they speak, their disagreement over small matters, the absence of any real greeting — all of it creates a natural curiosity about their relationship and what put this distance there.\n\nFinding the recorder is an effective hook, because it introduces something tangible to drive the story forward. The suspense here does not rest on an external secret or a sudden event, but on the viewer's wish to know what the father said, and whether those words will change anything between his children. Distributing the messages across the film helps sustain that interest, since each recording can reveal something new or cast a different meaning over what we have already seen. The contrast between the father's calm voice and his children's reactions creates good tension: he feels close to the viewer through his voice, while to them he still seems out of reach even after his death.\n\nThe film might benefit from a first message that is sharper or more specific, one that promises the viewer that what follows is more than an emotional farewell. That does not mean turning the story into a mystery or raising the suspense past what its tone can carry — only giving the opening a more urgent dramatic question. The disagreement over the fate of the house could likewise be planted earlier, so the viewer feels the day holds not just a reckoning with the past but a present decision the characters will come out of changed. The hook is good and suits the material; it would be stronger still if the story opened at slightly higher tension." },
      "Stakes & Plot": { score: 4, text: "The plot rests on a simple, legible external goal: empty the father's house before it is sold. That simplicity is a strength, because the script does not burden the story with extra incident or subplots it does not need. Instead it makes the sorting, the clearing, and the small daily decisions the engine of the conflict. Choosing what is thrown away and what is kept, and who has the right to decide, becomes a natural extension of the disagreement between Nora and Salem. To the script's credit, that conflict does not appear all at once but develops with each new detail the house or the recordings reveal.\n\nThe stakes escalate well once it becomes clear that selling the house does not mean the same thing to each of them. For Nora the sale looks like a way out of a place that reminds her of promises never kept and of a relationship that left her feeling let down. For Salem the house is the last tangible link to his father and to the family life that existed before things changed. That difference gives the conflict a psychological dimension that cannot be reduced to money or a property decision, and lets the viewer understand both of them even while disagreeing with one. The recordings, meanwhile, do not function as a ready solution: they complicate matters, because they reopen what each believed was behind them.\n\nWhat may need development is the climax. The two reach an affecting emotional confrontation, but its dramatic impact would be stronger if it came with a clear decision that changes something in their situation or in the fate of the house. That decision might concern the sale, or keeping one particular object, or admitting a truth one of them had hidden, or even choosing between playing the final message and leaving it unheard. What matters is that the viewer feels the confrontation was not simply a release of feeling but a moment that rearranged the relationship or moved the characters somewhere new. The plot holds together as it stands, but it needs a more decisive final choice for its effect to persist past the ending." },
      "Character": { score: 4, text: "Nora has a clear presence as the character who carries the film, and she manages to be both sympathetic and unsettling. She is not naturally hard or cold, but the practical way she handles her father's death and the house suggests she has chosen order and control to protect herself from feelings she does not know how to face. The script wisely never explains this outright; it lets it emerge through her behaviour — her hurry to be done, her objection to keeping things that seem unimportant, her wish to avoid talking whenever Salem moves near the past. Those details make her legible and worth sympathising with, even in the moments she seems harsh.\n\nSalem is a good counterweight, because he is not presented as the more sensitive or the more correct of the two, but as someone who chose a different way of handling loss. He seems more attached to the place and its objects, though he does not necessarily have the language to explain that attachment. His calm does not mean an absence of anger either; it may simply be another way of concealing it. The film uses this contrast to build natural tension: each sees the other as behaving wrongly, while the viewer gradually discovers that both are carrying a different shape of the same pain.\n\nThe father is a third, affecting presence despite his physical absence, which is a good structural choice. The recordings let him appear as an incomplete person who tried to understand and apologise too late, rather than as an ideal figure or the one responsible for everything. Salem, however, needs more independent space; several of his motives read as reactions to Nora or to his father's words. It would help to give him a moment or a detail that reveals what he personally lost, and what he is afraid of losing once the house is sold. The conflict between them would then be better balanced, and their decisions would carry equal weight." },
      "Dialogue": { score: 3, text: "The dialogue has natural, affecting moments, particularly where the characters rely on short lines and unfinished replies. There is a good sense that Nora and Salem know each other well and do not need to restate the family history every time they speak. That strength shows in the interruptions, the shifts of tone, and the lines that begin meaning one thing and end meaning another. The recordings also give the film a chance to give the father a different register: he speaks from reflection and regret, while his children speak from inside anger and hesitation.\n\nSome exchanges, though, tend to state too much, particularly when the characters begin explaining what happened in the past or describing their feelings plainly. In those places the dialogue sometimes explains the idea to the viewer instead of revealing it through conflict. It would be better for the characters to trust what they both already know, rather than saying all of it aloud. Some of the longer lines could be replaced by a look, a hesitation, a change of subject, or an action that carries what the character cannot say.\n\nThe dialogue also needs more distinction between the voices. It would help for Nora to speak more tersely and decisively, for Salem's speech to carry his hesitation and his wish to avoid confrontation, and for the recordings to be more composed and reflective, in keeping with the father's nature and his guilt. The film does not need a great deal of dialogue to land; the strength of the premise is that the characters say less than they feel. Reviewing and trimming the more explanatory scenes would make the dialogue more cinematic, and closer to the quiet register the work is reaching for." },
      "Structure & Pace": { score: 4, text: "The film opens at the right moment, entering its world directly and giving the viewer a clear objective from the start. It needs no long introductory section: Nora inside the house, and then Salem's arrival, are enough to establish the emotional situation. The single location also works in the pacing's favour, because it keeps the characters enclosed by the place and its memories, and gives the viewer the sense that any room might open a new door in the story. Setting the action across one day suits a short film, since the pressure of time keeps the story from dispersing.\n\nThe pace develops well through the first half, driven by the discovery of the recordings and the shifting relationship between the two. The movement of sorting and passing among the household objects gives the viewer visual variety despite the limited location. The middle section, however, would benefit from greater differentiation between scenes, so that several moments do not perform the same emotional function. If each new recording reveals something different, or pushes Nora and Salem to a new level of confrontation, the viewer will feel a clearer escalation. If the scenes instead repeat the fact of an old disagreement, the pace may slacken unnecessarily.\n\nThe ending reaches a register that suits the film, because it does not try to resolve everything or convert a family rift into an ideal reconciliation. That is a good choice, particularly since loss offers no final answers in life either. Even so, the last moment needs an image or an action that carries the meaning of the change that has occurred. It could be something very small: deciding to share a particular object, leaving a final message unplayed, choosing to stay in the house a few minutes longer instead of leaving. That closing touch would give the pacing a firmer conclusion, and make the characters' emotional shift visible rather than only spoken." },
      "Producibility": { score: 5, text: "The script is highly producible, resting on a single principal location and a small number of characters, with no need for complex exteriors or large production elements. The family house is the visual and dramatic heart of the work, and a suitable location could be found or partly built economically in service of the story. Most of the action passes between Nora and Salem, while the father is present through voice alone, which reduces both casting needs and shooting days without weakening the film's emotional world.\n\nThe voice recordings are a smart production solution, because they bring the past into the present without resorting to flashbacks that would require additional locations, actors, wardrobe and period design. The film relies on no special effects, action sequences, or large numbers of extras, so a greater share of the budget can go to the elements that will actually make the difference: casting, the quality of the sound recording, set design, lighting and editing.\n\nThe main production challenge will be making the house feel alive and carry the family's history without turning into a crowded set with no function. The objects need careful selection, since some of them must reveal information, provoke reactions, or add a layer to the father. Sound design matters a great deal too, not only in the recordings but in the silence of the house and the small noises inside it, because these can give the film its sense of solitude and memory. Overall the project is economical and achievable on a low to moderate budget, with a clear opportunity to raise its artistic value through precise execution." },
      "Presentation": { score: 4, text: "The script is generally clear and easy to read, which matters in a short film built on fine detail and close relationships. The scenes are organised, the transitions between rooms and moments are comprehensible, and the visual description never overwhelms the dialogue or slows the read. The text gives the reader a good impression of the atmosphere of the place and the emotional state of the characters, without imposing so much directorial detail that it would constrain a future director's vision.\n\nA real strength is that most of the description is shootable and does not rely on interior explanation or abstract feeling that cannot be translated visually. Even so, a few places describe the characters' feelings directly and could be replaced with behaviour, movement, or a concrete detail. It would also help to standardise how the recordings are written, either by marking their source clearly or by keeping a consistent format at the start and end of each message, since they are central to the structure and must be easy to follow on the page.\n\nThe script needs a final editorial pass to settle punctuation, unify some terminology, and confirm that every scene performs a clear function. These are not fundamental notes on the quality of the writing, but improvements that will present the script more professionally when it goes to a producer, a director, or a funding body. The presentation is good, and reflects a project with a clear vision that is ready to be developed and made." }
    },
    market: {

      genreDemand: "The project sits within human family drama, a type consistently present in short film circuits and in local, regional and international festivals. Its strength does not depend on an unprecedented subject so much as on honesty in the treatment and the execution, which count for a great deal in this kind of work. The project could stand out given a sensitive directorial vision, strong performance choices, and a sound design that adds value to the idea of the recordings. The limited production scale is an advantage in the independent market, because it keeps execution realistic without shrinking the emotional ambition.",

      budgetCeiling: "The expected budget looks low to moderate, since production is concentrated in one location with a limited cast. The largest share will go to the location, the actors, lighting, art direction, sound and editing. The film depends on no expensive elements or technically complex sequences, which makes cost control achievable. On the return side, the ceiling for direct commercial revenue remains limited by the nature of short films, but the project's value can show in funding, awards, licensed screenings, and in building its makers' professional path.",
      regional: "Reach potential is good, because the work's themes travel beyond the specifics of its local setting: loss, a rift between siblings, and the wish to understand after someone important has gone are feelings a wide audience can meet. The local identity of the place, the dialect and the family detail can add authenticity rather than limit its reach, as long as it does not depend on information an outside viewer would struggle to follow. The work has a fair chance at regional and international festivals if it keeps its density and avoids explanatory dialogue.",
      net: "The project has good potential on the short film path, combining a sympathetic human premise, a realistic production scale, and an opportunity for affecting performance. Its strength lies in the relationship between Nora and Salem and in the use of the house and the recordings as dramatic instruments, while it needs a stronger climax and tighter dialogue to reach its best version. With those developed, it could deliver a film well suited to festivals, support programmes and selected showcases."

    overall: {
      strengths: "The script tells a clear human story that needs no large elements to leave a mark. Its central strength is understanding that loss does not always appear in weeping or in direct speech: it can appear in a decision to sell a house, in an argument over a simple object, or in one person's wish to finish everything quickly because they cannot bear to stay. The relationship between the siblings is written so that both invite sympathy; neither is presented as the absolute victim or the sole party at fault, which gives the film emotional maturity.\n\nThe choice of the house and the voice recordings is among the project's best decisions. The house carries the memory, the recordings give the father an absent presence, and together they allow rich drama within a limited production footprint. The work also holds a quiet, consistent register and never tries to force large feelings on the viewer by direct or contrived means. If the execution can preserve that quiet alongside honest performance and precise sound design, the film will have a real capacity to move an audience.",
      toDevelop: "What the script most needs is to make the root cause of the rift more specific and more consequential, since that event is the hidden engine behind everything happening in the present. The writer need not reveal it all early, but the details that do surface later must be enough to account for the scale of the anger and distance between the two. Salem also needs more space to reveal his own relationship to his father and to the house, so the story does not read as Nora's journey alone with him left in the position of responding.\n\nDialogue is the element most in need of revision. There are very good moments where the script leaves room for silence and for unstated meaning, but some scenes explain more than they need to. The more the script trusts the viewer and lets the image and the behaviour carry part of the meaning, the stronger it becomes. Finally, the climax needs a final decision or a clear action to give the ending more weight, while keeping the open, indirect register that suits the subject."
