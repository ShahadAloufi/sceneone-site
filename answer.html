<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Scene One | الرد على استفسار الكاتب</title>
<link rel="icon" type="image/png" href="assets/favicon-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
  document.documentElement.setAttribute('lang','ar');
  document.documentElement.setAttribute('dir','rtl');
</script>
<style>
  /* Same shell as report.html / ask.html — the reader arrives here from the
     question email, so it should read as part of the same flow. */
  :root{
    --ink:#15110f; --orange:#CD2E07; --line:#e7e2da; --line2:#efebe3;
    --muted:#8a8178; --label:#6f665e; --soft:#f3efe8;
    --page:#efeae2;
    --font:'Tajawal',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  /* English: swap to IBM Plex Sans, same split as the marketing pages'
     css/styles.css (this page is self-contained, so it needs its own copy). */
  html[dir="ltr"]{
    --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--page);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased}

  .bar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;
       padding:12px 20px;background:rgba(14,14,14,.96);border-bottom:2px solid var(--orange)}
  .bar .wm{height:26px;width:auto;display:block}

  main{padding:28px 16px 60px}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;max-width:640px;margin:0 auto;
        box-shadow:0 18px 50px rgba(0,0,0,.12);padding:40px 44px}
  @media(max-width:620px){.card{padding:28px 20px}}

  h1{font-size:23px;font-weight:600;margin:0 0 10px;line-height:1.4}
  .title{font-size:14px;color:var(--muted);margin:0 0 26px}
  .title strong{color:var(--ink);font-weight:600}

  .quote{background:var(--soft);border-radius:12px;padding:18px 20px;margin:0 0 26px}
  .quote .k{font-size:10px;letter-spacing:.06em;color:var(--label);font-weight:600;margin-bottom:8px}
  .quote .v{font-size:14.5px;line-height:1.8;white-space:pre-wrap}

  .reply{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:0 0 4px}
  .reply .k{font-size:10px;letter-spacing:.06em;color:var(--orange);font-weight:600;margin-bottom:8px}
  .reply .v{font-size:14.5px;line-height:1.8;white-space:pre-wrap}

  label{display:block;font-size:10px;letter-spacing:.06em;text-transform:uppercase;
        color:var(--label);font-weight:600;margin:0 0 8px}
  /* The page is RTL, so `text-align: start` SHOULD resolve to the right edge —
     but a textarea's placeholder is its own bidi context, and left to `start` it
     drifted away from the caret instead of sitting under it. State both
     explicitly: the field is Arabic, and the placeholder follows the field. */
  textarea{width:100%;min-height:180px;resize:vertical;direction:rtl;text-align:right;font-family:inherit;font-size:14.5px;line-height:1.8;
           color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  textarea::placeholder{text-align:right;direction:rtl}
  textarea:focus{outline:none;border-color:var(--orange)}
  .count{font-size:12px;color:var(--muted);margin-top:8px;text-align:left;direction:ltr}
  /* Attachment row. Deliberately quiet: the reply is the point, the file is the
     option. The native file input is replaced by a labelled button because its
     own chrome cannot be styled and reads as a foreign control here. */
  .att{margin-top:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .att__btn{border:1px solid var(--line);background:transparent;color:inherit;font-family:inherit;
            font-size:14px;border-radius:10px;padding:10px 18px;cursor:pointer}
  .att__btn:hover{background:rgba(0,0,0,.04)}
  .att__btn:disabled{opacity:.55;cursor:default}
  .att__name{font-size:14px;color:var(--muted);word-break:break-all}
  .att__rm{border:0;background:transparent;color:#cd2e07;font-family:inherit;font-size:14px;
           cursor:pointer;padding:4px}
  .att__hint{margin-top:8px;font-size:12px;line-height:1.7;color:var(--muted)}

  .btn{margin-top:22px;width:100%;border:0;background:#111;color:#fff;font-family:inherit;
       font-size:15px;font-weight:600;padding:15px 20px;border-radius:12px;cursor:pointer;transition:.15s}
  .btn:hover:not(:disabled){background:#000}
  .btn:disabled{opacity:.55;cursor:default}

  .msg{margin-top:16px;font-size:14px;line-height:1.7;border-radius:10px;padding:12px 14px;display:none}
  .msg.err{display:block;background:#fdecea;color:#8f2213}

  .state{max-width:520px;margin:80px auto;text-align:center;padding:0 20px;color:var(--label)}
  .state h2{color:var(--ink);font-size:20px;margin:0 0 8px}
  [hidden]{display:none!important}

  .done{text-align:center}
  .done .tick{width:52px;height:52px;border-radius:50%;background:var(--soft);color:var(--orange);
              display:flex;align-items:center;justify-content:center;font-size:26px;margin:0 auto 18px}
  .done h2{font-size:21px;margin:0 0 10px}
  .done p{font-size:14.5px;color:var(--label);margin:0}
</style>

<div class="bar">
  <img class="wm" src="assets/scene-one-mark-v3.svg" alt="Scene One">
</div>

<main>
  <div class="state" id="loading"><h2>جارٍ التحميل…</h2></div>

  <div class="state" id="errorBox" hidden>
    <h2>الرابط غير متاح</h2>
    <p>قد يكون الرابط غير صحيح أو منتهي الصلاحية.</p>
  </div>

  <div class="card" id="form" hidden>
    <h1>الرد على استفسار الكاتب</h1>
    <p class="title" id="titleLine"></p>

    <div class="quote">
      <div class="k">استفسار الكاتب</div>
      <div class="v" id="qText"></div>
    </div>

    <label for="a">اكتب ردّك على استفسار الكاتب</label>
    <textarea id="a" dir="rtl" maxlength="5000" placeholder="اكتب ردّك هنا…"></textarea>
    <div class="count"><span id="count">0</span> / 5000</div>

    <div class="att">
      <input type="file" id="attInput" hidden
             accept=".pdf,.doc,.docx,.txt,.rtf,.fdx,.png,.jpg,.jpeg,.webp">
      <button type="button" class="att__btn" id="attBtn">إضافة مرفق</button>
      <span class="att__name" id="attName" hidden></span>
      <button type="button" class="att__rm" id="attRm" hidden>إزالة</button>
    </div>
    <p class="att__hint">اختياري. ملف واحد يصل الكاتب مع ردّك، بحد أقصى 10 ميغابايت.</p>

    <button class="btn" id="send">إرسال الرد إلى الكاتب</button>
    <div class="msg" id="msg"></div>
  </div>

  <!-- Already answered: show the thread read-only rather than a form. -->
  <div class="card" id="answered" hidden>
    <h1>تم الرد على هذا الاستفسار</h1>
    <p class="title" id="titleLine2"></p>
    <div class="quote">
      <div class="k">استفسار الكاتب</div>
      <div class="v" id="qText2"></div>
    </div>
    <div class="reply">
      <div class="k">ردّك</div>
      <div class="v" id="aText"></div>
    </div>
  </div>

  <div class="card done" id="done" hidden>
    <div class="tick">✓</div>
    <h2>تم إرسال ردّك</h2>
    <p>وصل ردّك إلى الكاتب على بريده الإلكتروني.</p>
  </div>
</main>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }

  var token = new URLSearchParams(location.search).get("q") || "";
  var UUID_RE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/i;

  function showError() {
    $("loading").hidden = true; $("form").hidden = true; $("errorBox").hidden = false;
  }

  if (!UUID_RE.test(token)) { showError(); return; }

  function titleOf(s) { return (s && (s.title_ar || s.title_en)) || ""; }
  function setTitle(el, t) {
    if (!t) return;
    el.textContent = "";
    el.appendChild(document.createTextNode("العنوان: "));
    var strong = document.createElement("strong");
    strong.textContent = t;
    el.appendChild(strong);
  }

  fetch("/api/questions?q=" + encodeURIComponent(token))
    .then(function (r) { if (!r.ok) throw new Error("unavailable"); return r.json(); })
    .then(function (d) {
      var t = titleOf(d.submission);
      $("loading").hidden = true;

      if (d.answer) {
        setTitle($("titleLine2"), t);
        $("qText2").textContent = d.question || "";
        $("aText").textContent = d.answer;
        $("answered").hidden = false;
        return;
      }

      setTitle($("titleLine"), t);
      $("qText").textContent = d.question || "";
      $("form").hidden = false;
    })
    .catch(showError);

  var a = $("a");
  a.addEventListener("input", function () { $("count").textContent = a.value.length; });

  /* ---------- ATTACHMENT ----------
     This page has no Supabase session — it is reached from a tokenised email
     link — so it cannot upload under the `attachments` bucket's admin-only RLS.
     It asks /api/questions for a one-shot signed upload URL and PUTs the file
     straight to Storage, which also keeps a 10MB file away from a function whose
     request body limit is 4.5MB.

     The upload runs on PICK, not on send: by the time the reader presses the
     button the file is already in place and the reply is one small JSON POST, so
     a slow upload can never look like a slow send. `attached` holds the
     {name, path} that travels with the reply — null until an upload actually
     succeeds, so a failed one is never silently sent as though it worked. */
  var ATT_MAX = 10 * 1024 * 1024;
  var attached = null;
  var attIn = $("attInput"), attBtn = $("attBtn"), attName = $("attName"), attRm = $("attRm");

  function attReset() {
    attached = null;
    attIn.value = "";                       // so re-picking the same file re-fires change
    attName.hidden = true; attName.textContent = "";
    attRm.hidden = true;
    attBtn.hidden = false; attBtn.disabled = false;
    attBtn.textContent = "إضافة مرفق";
  }
  function attFail(text) {
    var m = $("msg");
    m.className = "msg err";
    m.textContent = text;
    attReset();
  }

  attBtn.addEventListener("click", function () { attIn.click(); });
  attRm.addEventListener("click", attReset);

  attIn.addEventListener("change", function () {
    var file = attIn.files && attIn.files[0];
    if (!file) return;
    if (file.size > ATT_MAX) { attFail("حجم الملف يتجاوز 10 ميغابايت."); return; }

    $("msg").className = "msg";
    attBtn.disabled = true;
    attBtn.textContent = "جارٍ الرفع…";

    fetch("/api/questions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: token, upload: { name: file.name, size: file.size, type: file.type } }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.d && res.d.message) || "failed");
        return fetch(res.d.uploadUrl, {
          method: "PUT",
          headers: { "Content-Type": file.type || "application/octet-stream" },
          body: file,
        }).then(function (up) {
          if (!up.ok) throw new Error("failed");
          return { name: file.name, path: res.d.path };
        });
      })
      .then(function (att) {
        attached = att;
        attBtn.hidden = true;
        attName.hidden = false; attName.textContent = att.name;
        attRm.hidden = false;
      })
      .catch(function (e) {
        attFail(e.message && e.message !== "failed" ? e.message : "تعذّر رفع الملف، حاول مرة أخرى.");
      });
  });

  $("send").addEventListener("click", function () {
    var btn = this;
    var text = a.value.trim();
    var msg = $("msg");
    msg.className = "msg";

    if (!text) {
      msg.className = "msg err";
      msg.textContent = "الرجاء كتابة الرد قبل الإرسال.";
      return;
    }

    btn.disabled = true;
    var old = btn.textContent;
    btn.textContent = "جارٍ الإرسال…";

    fetch("/api/questions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ q: token, answer: text, attachment: attached }),
    })
      .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
      .then(function (res) {
        if (!res.ok) throw new Error((res.d && res.d.message) || "failed");
        $("form").hidden = true;
        $("done").hidden = false;
      })
      .catch(function (e) {
        msg.className = "msg err";
        msg.textContent = e.message && e.message !== "failed"
          ? e.message
          : "تعذّر إرسال الرد، حاول مرة أخرى.";
        btn.disabled = false;
        btn.textContent = old;
      });
  });
})();
</script>
